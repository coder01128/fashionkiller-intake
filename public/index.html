<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FashionKiller Intake</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --pink:#FF006E;
    --pink-dim:#cc0058;
    --bg:#0a0a0a;
    --panel:#141414;
    --panel-2:#1c1c1c;
    --border:#2a2a2a;
    --text:#f0f0f0;
    --muted:#aaa;
    --good:#22c55e;
    --warn:#f59e0b;
  }
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:13px}
  #app{display:grid;grid-template-rows:56px 1fr auto;height:100vh}
  header{display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
  .brand{font-family:'Bebas Neue';font-size:24px;letter-spacing:2px;color:var(--pink)}
  .progress{flex:1;display:flex;align-items:center;gap:12px}
  .progress-bar{flex:1;max-width:300px;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;background:var(--pink);transition:width .3s}
  .progress-text{font-size:12px;color:var(--muted)}
  .btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;font-family:inherit}
  .btn:hover{border-color:var(--pink)}
  .btn-primary{background:var(--pink);border-color:var(--pink);color:#fff}
  .btn-primary:hover{background:var(--pink-dim);border-color:var(--pink-dim)}
  .btn-ghost{background:transparent}
  main{display:grid;grid-template-columns:280px 1fr;overflow:hidden}
  #sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .sidebar-head{padding:12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .search{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:12px;font-family:inherit;width:100%}
  .search:focus{outline:none;border-color:var(--pink)}
  .product-list{flex:1;overflow-y:auto}
  .product-item{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
  .product-item:hover{background:var(--panel-2)}
  .product-item.active{background:var(--panel-2);border-left:3px solid var(--pink);padding-left:9px}
  .product-thumb{width:32px;height:32px;background:var(--panel-2);border-radius:4px;flex-shrink:0;background-size:cover;background-position:center}
  .product-meta{flex:1;min-width:0}
  .product-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .product-code{font-size:10px;color:var(--muted)}
  .status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .status-empty{background:#444}
  .status-partial{background:var(--warn)}
  .status-complete{background:var(--good)}
  #editor{overflow-y:auto;padding:24px 32px;max-width:1200px;margin:0 auto;width:100%}
  .editor-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .editor-title{font-family:'Bebas Neue';font-size:32px;letter-spacing:1px}
  .save-indicator{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .save-dot{width:6px;height:6px;border-radius:50%;background:var(--good)}
  .nav-row{display:flex;gap:8px}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field-full{grid-column:1/-1}
  label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#ccc;font-weight:600}
  input,textarea,select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:6px;font-size:13px;font-family:inherit;width:100%}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pink)}
  textarea{resize:vertical;min-height:80px}
  .section{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:16px;transition:border-color .2s}
  .section:focus-within{border-color:var(--pink);box-shadow:0 0 0 1px rgba(255,0,110,.15)}
  .section-title{font-family:'Bebas Neue';font-size:18px;letter-spacing:1px;color:var(--pink);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
  .dropzone{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all .15s;background:var(--panel-2)}
  .dropzone:hover,.dropzone.drag{border-color:var(--pink);background:rgba(255,0,110,.05)}
  .dropzone-hint{color:var(--muted);font-size:12px}
  .dropzone-hint kbd{background:var(--bg);padding:2px 6px;border-radius:3px;font-size:10px;border:1px solid var(--border)}
  .image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
  .image-tile{position:relative;aspect-ratio:1;background:var(--panel-2);border-radius:6px;overflow:hidden;background-size:cover;background-position:center}
  .image-tile .remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
  .image-tile .remove:hover{background:var(--pink)}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{background:var(--panel-2);border:1px solid var(--border);padding:5px 10px;border-radius:14px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none}
  .chip.active{background:var(--pink);border-color:var(--pink);color:#fff}
  .chip.removable .x{font-size:14px;line-height:1;opacity:.7}
  .chip.removable:hover .x{opacity:1}
  .chip-input{background:var(--panel-2);border:1px dashed var(--border);padding:4px 10px;border-radius:14px;font-size:11px;color:var(--text);width:100px;font-family:inherit}
  .chip-input:focus{outline:none;border-color:var(--pink);border-style:solid}
  .pricing-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
  .calc-box{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .calc-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .calc-value{font-family:'Bebas Neue';font-size:22px;color:var(--pink);letter-spacing:1px}
  .calc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .small-action{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:4px;font-size:10px;cursor:pointer;font-family:inherit}
  .small-action:hover{color:var(--pink);border-color:var(--pink)}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty-state h2{font-family:'Bebas Neue';font-size:28px;color:var(--text);margin-bottom:10px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:24px;max-width:500px;width:100%;max-height:calc(100vh - 40px);overflow-y:auto;margin:auto}
  .modal h3{font-family:'Bebas Neue';font-size:22px;margin-bottom:14px;letter-spacing:1px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--pink);padding:12px 16px;border-radius:6px;z-index:200;animation:slide .3s}
  @keyframes slide{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
  .help{font-size:11px;color:var(--muted);margin-top:4px}
  a{color:var(--pink);text-decoration:none}
  a:hover{text-decoration:underline}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--pink-dim)}
  /* Smart Import + Table View additions */
  .modal-lg{max-width:780px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
  .tab{padding:8px 14px;background:transparent;border:none;color:var(--muted);cursor:pointer;font-family:inherit;font-size:12px;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--pink);border-bottom-color:var(--pink)}
  .tab-pane{display:none}
  .tab-pane.active{display:block}
  .extracted-row{display:grid;grid-template-columns:24px 110px 1fr 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);align-items:center;font-size:12px}
  .extracted-row .field-label{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px;font-size:10px}
  .extracted-row .old-val{color:var(--muted);font-style:italic}
  .extracted-row .new-val{color:var(--text);background:rgba(255,0,110,.08);padding:4px 8px;border-radius:4px}
  .extracted-img-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .extracted-img-row a{display:block;width:80px;height:80px;border-radius:4px;background-size:cover;background-position:center;border:1px solid var(--border);position:relative}
  .extracted-img-row a:hover{border-color:var(--pink)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* Table view */
  #tableView{padding:0;overflow:hidden;height:100%;display:flex;flex-direction:column}
  table.master{width:max-content;min-width:100%;border-collapse:collapse;font-size:12px}
  table.master th{background:var(--panel);padding:10px 10px;text-align:left;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:1px;color:#fff;border-bottom:2px solid var(--border);border-right:1px solid var(--border);position:sticky;top:0;cursor:pointer;white-space:nowrap;z-index:2;user-select:none}
  table.master th:hover{color:var(--pink)}
  table.master th.sort-active{color:var(--pink)}
  table.master td{padding:6px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:top;word-wrap:break-word;white-space:normal;max-width:300px}
  table.master tr:hover td{background:rgba(255,0,110,.03)}
  table.master tr:nth-child(even) td{background:rgba(255,255,255,.015)}
  table.master td.thumb-cell{width:44px;padding:4px;vertical-align:middle}
  table.master .row-thumb{width:36px;height:36px;background:var(--panel-2);border-radius:4px;background-size:cover;background-position:center;cursor:pointer}
  table.master input,table.master select{background:transparent;border:1px solid transparent;padding:4px 6px;border-radius:3px;font-size:12px;width:100%;color:var(--text);font-family:inherit}
  table.master input:hover,table.master select:hover{border-color:var(--border)}
  table.master input:focus,table.master select:focus,table.master textarea:focus{border-color:var(--pink);background:var(--panel-2);outline:none}
  table.master textarea{background:transparent;border:1px solid transparent;padding:4px 6px;border-radius:3px;font-size:12px;width:100%;color:var(--text);font-family:inherit;resize:vertical;min-height:60px}
  table.master input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
  .table-img-strip{display:flex;gap:3px;flex-wrap:wrap}
  .table-img-strip .timg{width:32px;height:32px;border-radius:3px;background-size:cover;background-position:center;background-color:var(--panel-2);cursor:pointer;flex-shrink:0}
  table.master .cell-formula{color:var(--pink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;padding:4px 8px;font-size:12px}
  table.master .cell-computed{color:var(--muted);font-style:italic;text-align:right;padding:4px 8px;font-size:11px}
  table.master .row-num{color:var(--muted);font-size:10px;text-align:center;width:30px;padding:4px}
  .table-toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:3}
  .table-toolbar .count{font-size:11px;color:var(--muted)}
  .table-summary{padding:12px 16px;background:var(--panel);border-top:2px solid var(--border)}
  .table-summary b{color:var(--pink)}
  .scorecard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .score-tile{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .score-tile .score-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
  .score-tile .score-val{font-family:'Bebas Neue';font-size:24px;letter-spacing:1px;color:var(--text)}
  .score-tile .score-sub{font-size:10px;color:var(--muted)}
  .score-tile.highlight{border-color:var(--pink);background:rgba(255,0,110,.06)}
  .score-tile.highlight .score-val{color:var(--pink)}
  #scorecard{background:var(--panel);border-top:2px solid var(--border);padding:12px 16px;overflow-x:auto}
  .api-cost-note{font-size:11px;color:var(--muted);margin-top:8px;padding:8px;background:var(--panel-2);border-radius:4px}
  /* Stock by size grid */
  .stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:10px}
  .stock-cell{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 10px;text-align:center}
  .stock-cell input{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 6px;border-radius:5px;width:100%;text-align:center;font-size:18px;font-weight:700;font-family:inherit}
  .stock-cell input:focus{outline:none;border-color:var(--pink)}
  .stock-size{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;font-weight:700}
  .stock-cell.stock-total{background:rgba(255,0,110,.08);border-color:var(--pink)}
  .stock-total-val{font-family:'Bebas Neue';font-size:30px;color:var(--pink);letter-spacing:1px;padding:2px 0;line-height:1.1}
  /* ============ PIPELINE ============ */
  .pipeline{background:linear-gradient(135deg, rgba(255,0,110,.08) 0%, rgba(255,0,110,.02) 100%);border:1px solid var(--pink);border-radius:10px;padding:18px;margin-bottom:16px}
  .pipeline-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .pipeline-title{font-family:'Bebas Neue';font-size:20px;letter-spacing:1px;color:var(--pink);display:flex;align-items:center;gap:8px}
  .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .slot{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:border-color .15s}
  .slot.has-images{border-color:var(--muted)}
  .slot.extracted{border-color:var(--good)}
  .slot.failed{border-color:#f87171}
  .slot.extracting{border-color:var(--warn)}
  .slot-head{display:flex;align-items:center;justify-content:space-between}
  .slot-num{font-family:'Bebas Neue';font-size:14px;letter-spacing:1px;color:var(--muted)}
  .slot-num .num{display:inline-flex;width:20px;height:20px;background:var(--panel-2);border-radius:50%;align-items:center;justify-content:center;font-size:11px;margin-right:6px;color:var(--text)}
  .slot.extracted .num{background:var(--good);color:#000}
  .slot.failed .num{background:#f87171;color:#000}
  .slot.extracting .num{background:var(--warn);color:#000}
  .slot-status-badge{font-size:9px;text-transform:uppercase;letter-spacing:1px;padding:2px 6px;border-radius:3px;background:var(--panel-2);color:var(--muted)}
  .slot.extracted .slot-status-badge{background:var(--good);color:#000}
  .slot.failed .slot-status-badge{background:#f87171;color:#000}
  .slot.extracting .slot-status-badge{background:var(--warn);color:#000}
  .slot-label{font-size:11px;color:var(--text);font-weight:500}
  .slot-drop{border:2px dashed var(--border);border-radius:6px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .15s;background:var(--panel-2);font-size:11px;color:var(--muted);min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .slot-drop:hover,.slot-drop.drag{border-color:var(--pink);color:var(--pink);background:rgba(255,0,110,.05)}
  .slot:not(.has-images):not(.extracted):not(.extracting):not(.failed) .slot-drop{animation:slotPulse 2.5s ease-in-out infinite}
  @keyframes slotPulse{
    0%,100%{border-color:var(--border);box-shadow:0 0 0 0 rgba(255,0,110,0)}
    50%{border-color:rgba(255,0,110,.4);box-shadow:0 0 12px 0 rgba(255,0,110,.12)}
  }
  .slot-thumbs{display:flex;gap:4px;flex-wrap:wrap}
  .slot-thumb{width:38px;height:38px;border-radius:4px;background-size:cover;background-position:center;background-color:var(--panel-2);position:relative;cursor:pointer}
  .slot-thumb .del{position:absolute;top:-4px;right:-4px;background:#f87171;color:#fff;border:none;width:16px;height:16px;border-radius:50%;font-size:10px;cursor:pointer;line-height:1;display:none;align-items:center;justify-content:center}
  .slot-thumb:hover .del{display:flex}
  .slot-actions{display:flex;gap:4px;margin-top:auto}
  .slot-btn{flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:4px;font-size:10px;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:1px}
  .slot-btn:hover:not(:disabled){border-color:var(--pink);color:var(--pink)}
  .slot-btn:disabled{opacity:.4;cursor:not-allowed}
  .slot-extracted-preview{font-size:10px;color:var(--muted);padding:6px;background:var(--panel-2);border-radius:4px;max-height:80px;overflow-y:auto;line-height:1.4}
  .slot-extracted-preview b{color:var(--text)}
  .pipeline-cta{display:flex;gap:8px;align-items:center}
  .cta-big{flex:1;background:var(--pink);border:none;color:#fff;padding:12px;border-radius:6px;font-weight:600;cursor:pointer;font-family:inherit;font-size:13px;letter-spacing:1px;text-transform:uppercase;transition:background .15s}
  .cta-big:hover:not(:disabled){background:var(--pink-dim)}
  .cta-big:disabled{background:var(--border);cursor:not-allowed;color:var(--muted)}
  /* Gallery */
  .gallery-section{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;transition:border-color .2s}
  .gallery-section:focus-within{border-color:var(--pink);box-shadow:0 0 0 1px rgba(255,0,110,.15)}
  /* Manual override collapse */
  .manual-override{margin-top:20px;border-top:1px solid var(--border);padding-top:14px}
  .override-toggle{background:transparent;border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between}
  .override-toggle:hover{border-color:var(--pink)}
  .override-toggle.open{border-color:var(--pink);color:var(--pink)}
  .override-content{display:none;margin-top:14px}
  .override-content.open{display:block}
  /* Extracted specs display */
  .specs-display{display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:8px;margin-top:10px}
  .spec-pill{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:11px}
  .spec-pill b{display:block;color:var(--muted);text-transform:uppercase;font-size:9px;letter-spacing:1px;margin-bottom:2px;font-weight:600}
  .spec-pill span{color:var(--text)}
  /* Sizing chart data table */
  .sizing-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}
  .sizing-table th{background:var(--panel-2);padding:6px 8px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border)}
  .sizing-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
  .sizing-table td input{background:transparent;border:1px solid transparent;padding:2px 4px;border-radius:3px;color:var(--text);font-size:11px;width:60px;font-family:inherit}
  .sizing-table td input:hover{border-color:var(--border)}
  .sizing-table td input:focus{outline:none;border-color:var(--pink)}
  /* Sidebar resize */
  #sidebarResize{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:10;background:transparent}
  #sidebarResize:hover,#sidebarResize.dragging{background:var(--pink)}
  #sidebar{position:relative}
  /* Login screen */
  #loginScreen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center}
  .login-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:40px;max-width:380px;width:90%;text-align:center}
  .login-box .brand{font-size:32px;margin-bottom:6px}
  .login-box .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .login-box input{margin-bottom:12px}

// ============ CLOUD SYNC ============
function productToRow(p){
  return {
    id: p.id,
    user_id: sbUser.id,
    name: p.name||'', code: p.code||'', keywords: p.keywords||'',
    description: p.description||'', short_description: p.shortDescription||'',
    category: p.category||'', tags: p.tags||'',
    sizes: p.sizes||[], colours: p.colours||[],
    stock_by_size: p.stockBySize||{},
    cost_price: parseFloat(p.costPrice)||null,
    shipping_per_unit: calcShipPerUnit(p),
    duty_multiplier: parseFloat(p.dutyMultiplier)||1.34,
    retail_price: parseFloat(p.retailPrice)||null,
    sale_price: parseFloat(p.salePrice)||null,
    currency: p.currency||'ZAR',
    weight_grams: parseInt(p.weightGrams)||null,
    supplier_name: p.supplierName||'', supplier_url: p.supplierUrl||'',
    specs: p.specs||{}, sizing_chart_data: p.sizingChartData||[],
    care_instructions: p.careInstructions||'', model_info: p.modelInfo||'',
    slot1_status: p.slot1Status||'empty', slot2_status: p.slot2Status||'empty', slot3_status: p.slot3Status||'empty',
    manual_review_done: p.manualReviewDone||false,
    slot1_image_paths: p.slot1ImageIds||[], slot2_image_paths: p.slot2ImageIds||[],
    slot3_image_paths: p.slot3ImageIds||[], gallery_image_paths: p.galleryImageIds||[],
    primary_image_path: (p.slot1ImageIds&&p.slot1ImageIds[0])||(p.imageIds&&p.imageIds[0])||null,
    sizing_chart_image_path: (p.slot2ImageIds&&p.slot2ImageIds[0])||p.sizingChartId||null,
    sort_order: state.products.indexOf(p),
  };
}

function rowToProduct(row){
  return {
    id: row.id, name: row.name||'', code: row.code||'', keywords: row.keywords||'',
    description: row.description||'', shortDescription: row.short_description||'',
    category: row.category||'', tags: row.tags||'',
    sizes: row.sizes||[], colours: row.colours||[],
    stockBySize: row.stock_by_size||{},
    costPrice: row.cost_price!=null?String(row.cost_price):'',
    shippingTotal: '', shippingItems: '',
    shippingPerUnit: row.shipping_per_unit!=null?String(row.shipping_per_unit):'',
    dutyMultiplier: row.duty_multiplier!=null?String(row.duty_multiplier):'1.34',
    retailPrice: row.retail_price!=null?String(row.retail_price):'',
    salePrice: row.sale_price!=null?String(row.sale_price):'',
    currency: row.currency||'ZAR',
    weightGrams: row.weight_grams!=null?String(row.weight_grams):'',
    supplierName: row.supplier_name||'', supplierUrl: row.supplier_url||'',
    specs: row.specs||{}, sizingChartData: row.sizing_chart_data||[],
    careInstructions: row.care_instructions||'', modelInfo: row.model_info||'',
    slot1Status: row.slot1_status||'empty', slot2Status: row.slot2_status||'empty', slot3Status: row.slot3_status||'empty',
    manualReviewDone: row.manual_review_done||false,
    slot1ImageIds: row.slot1_image_paths||[], slot2ImageIds: row.slot2_image_paths||[],
    slot3ImageIds: row.slot3_image_paths||[], galleryImageIds: row.gallery_image_paths||[],
    imageIds: row.primary_image_path?[row.primary_image_path]:[],
    sizingChartId: row.sizing_chart_image_path||null,
  };
}

async function syncProductToCloud(p){
  if (!sb || !sbUser) return;
  try {
    const row = productToRow(p);
    const { error } = await sb.from('products').upsert(row, {onConflict:'id'});
    if (error) { console.warn('[Sync] Product upsert error:', error.message); return; }
    // Sync images for this product
    const allImgIds = [...new Set([
      ...(p.slot1ImageIds||[]), ...(p.slot2ImageIds||[]),
      ...(p.slot3ImageIds||[]), ...(p.galleryImageIds||[]),
      ...(p.imageIds||[]), ...(p.sizingChartId?[p.sizingChartId]:[])
    ])];
    for (const imgId of allImgIds){
      await syncImageToCloud(imgId);
    }
  } catch(e){ console.warn('[Sync] Product sync failed:', e); }
}

async function syncImageToCloud(imgId){
  if (!sb || !sbUser) return;
  try {
    const dataUrl = await loadImage(imgId);
    if (!dataUrl) return;
    const b64 = dataUrl.split(',')[1];
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    const blob = new Blob([arr], {type:'image/jpeg'});
    const path = `${sbUser.id}/${imgId}.jpg`;
    const { error } = await sb.storage.from('product-images').upload(path, blob, {contentType:'image/jpeg', upsert:true});
    if (error && !error.message.includes('already exists')) console.warn('[Sync] Image upload error:', imgId, error.message);
  } catch(e){ console.warn('[Sync] Image sync failed:', imgId, e); }
}

async function syncFromCloud(){
  if (!sb || !sbUser) return;
  updateSyncBadge('syncing');
  try {
    const { data: cloudRows, error } = await sb.from('products')
      .select('*').eq('user_id', sbUser.id).order('sort_order');
    if (error) throw error;
    if (!cloudRows || !cloudRows.length) {
      // No cloud data — push local data up
      console.log('[Sync] No cloud data. Pushing local products up...');
      for (const p of state.products) {
        await syncProductToCloud(p);
      }
      updateSyncBadge('synced');
      return;
    }
    // Merge: cloud products not in local get added locally
    const localIds = new Set(state.products.map(p=>p.id));
    let added = 0;
    for (const row of cloudRows) {
      if (!localIds.has(row.id)) {
        const p = rowToProduct(row);
        state.products.push(p);
        await STORE.set('fk:p:'+p.id, JSON.stringify(p)).catch(()=>{});
        // Download images from cloud to local
        const allImgIds = [...new Set([
          ...(p.slot1ImageIds||[]), ...(p.slot2ImageIds||[]),
          ...(p.slot3ImageIds||[]), ...(p.galleryImageIds||[]),
          ...(p.imageIds||[]), ...(p.sizingChartId?[p.sizingChartId]:[])
        ])];
        for (const imgId of allImgIds){
          await downloadImageFromCloud(imgId);
        }
        added++;
      }
    }
    if (added) {
      await saveMeta();
      renderAll();
      showToast(`Synced ${added} product${added>1?'s':''} from cloud`);
    }
    // Also push any local products not in cloud
    const cloudIds = new Set(cloudRows.map(r=>r.id));
    for (const p of state.products){
      if (!cloudIds.has(p.id)) await syncProductToCloud(p);
    }
    updateSyncBadge('synced');
  } catch(e){
    console.warn('[Sync] Full sync failed:', e);
    updateSyncBadge('error');
  }
}

async function downloadImageFromCloud(imgId){
  if (!sb || !sbUser) return;
  // Check if already in local
  try {
    const existing = await STORE.get('fk:img:'+imgId);
    if (existing) return;  // Already have it locally
  } catch(e){}
  try {
    const path = `${sbUser.id}/${imgId}.jpg`;
    const { data, error } = await sb.storage.from('product-images').download(path);
    if (error || !data) return;
    const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = ()=>r(fr.result); fr.readAsDataURL(data); });
    await STORE.set('fk:img:'+imgId, dataUrl);
  } catch(e){ console.warn('[Sync] Image download failed:', imgId, e); }
}

async function deleteProductFromCloud(productId){
  if (!sb || !sbUser) return;
  try {
    await sb.from('products').delete().eq('id', productId).eq('user_id', sbUser.id);
  } catch(e){ console.warn('[Sync] Delete failed:', e); }
}

// Debounced sync — batches rapid saves into one sync operation
function queueSync(productId){
  if (!sb || !sbUser) return;
  if (!syncQueue.includes(productId)) syncQueue.push(productId);
  clearTimeout(syncTimer);
  syncTimer = setTimeout(flushSyncQueue, 2000);  // Wait 2s after last save
}

async function flushSyncQueue(){
  if (!syncQueue.length || !sb || !sbUser) return;
  updateSyncBadge('syncing');
  const ids = [...syncQueue];
  syncQueue = [];
  for (const id of ids){
    const p = state.products.find(x=>x.id===id);
    if (p) await syncProductToCloud(p);
  }
  updateSyncBadge('synced');
}

let state = {
  products: [],
  activeId: null,
  view: 'card',
  tableSort: {col:'name', dir:'asc'},
  sidebarWidth: 280,
  settings: {
    dutyRate: 45,           // legacy, no longer used for calc
    vatRate: 15,            // legacy
    defaultDutyMultiplier: 1.34,
    currency: 'ZAR',
    targetMarginPct: 60,
    apiKey: '',
  },
  filter: ''
};

const SIZES = ['XS','S','M','L','XL','XXL','XXXL'];

// ============ STORAGE (window.storage if in artifact, else IndexedDB) ============
const STORE = (function(){
  if (typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function') {
    console.log('[FK] Using window.storage (artifact mode)');
    return window.storage;
  }
  console.log('[FK] Using IndexedDB fallback (standalone mode)');
  const DB_NAME = 'fashionkiller_db', STORE_NAME = 'kv';
  let dbPromise;
  function getDb(){
    if (!dbPromise) dbPromise = new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
    return dbPromise;
  }
  function txStore(mode){ return getDb().then(db => db.transaction(STORE_NAME, mode).objectStore(STORE_NAME)); }
  return {
    async get(key){
      const s = await txStore('readonly');
      return new Promise((res, rej) => {
        const r = s.get(key);
        r.onsuccess = () => res(r.result === undefined ? null : {key, value: r.result});
        r.onerror = () => rej(r.error);
      });
    },
    async set(key, value){
      const s = await txStore('readwrite');
      return new Promise((res, rej) => {
        const r = s.put(value, key);
        r.onsuccess = () => res({key, value});
        r.onerror = () => rej(r.error);
      });
    },
    async delete(key){
      const s = await txStore('readwrite');
      return new Promise((res, rej) => {
        const r = s.delete(key);
        r.onsuccess = () => res({key, deleted: true});
        r.onerror = () => rej(r.error);
      });
    },
    async list(prefix){
      const s = await txStore('readonly');
      return new Promise((res, rej) => {
        const keys = [];
        const r = s.openKeyCursor();
        r.onsuccess = e => {
          const cur = e.target.result;
          if (cur){ if (!prefix || String(cur.key).startsWith(prefix)) keys.push(cur.key); cur.continue(); }
          else res({keys});
        };
        r.onerror = () => rej(r.error);
      });
    }
  };
})();

async function loadAll(){
  try {
    const meta = await STORE.get('fk:meta').catch(()=>null);
    if (meta) {
      const parsed = JSON.parse(meta.value);
      state.settings = {...state.settings, ...(parsed.settings||{})};
      if (parsed.sidebarWidth) state.sidebarWidth = parsed.sidebarWidth;
      const ids = parsed.productIds || [];
      for (const id of ids) {
        try {
          const p = await STORE.get('fk:p:'+id);
          if (p) state.products.push(JSON.parse(p.value));
        } catch(e){}
      }
    }
  } catch(e){ console.warn('Load:', e); }
  if (state.products.length && !state.activeId) state.activeId = state.products[0].id;
  applySidebarWidth();
  initSidebarDrag();
  renderAll();
}

function applySidebarWidth(){
  document.querySelector('main').style.gridTemplateColumns = `${state.sidebarWidth}px 1fr`;
}

function initSidebarDrag(){
  const handle = document.getElementById('sidebarResize');
  if (!handle) return;
  let dragging = false;
  handle.addEventListener('mousedown', e => {
    dragging = true;
    handle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'ew-resize';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.max(200, Math.min(600, e.clientX));
    state.sidebarWidth = w;
    applySidebarWidth();
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    saveMeta();
  });
}

  await STORE.set('fk:meta', JSON.stringify({

function statusOf(p){
  // Count completed slots (extracted or has manual data)
  const slot1Done = p.slot1Status === 'extracted' || !!p.name;
  const slot2Done = p.slot2Status === 'extracted' || p.sizes.length > 0;
  const slot3Done = p.slot3Status === 'extracted' || Object.keys(p.specs||{}).length > 0;
  const slotsDone = [slot1Done, slot2Done, slot3Done].filter(Boolean).length;

  if (slotsDone === 0 && !p.name && !p.code) return 'empty';
  if (slotsDone === 3 && p.manualReviewDone && p.costPrice) return 'complete';
  return 'partial';
}

// ============ IMAGE HANDLING ============
function compressImage(file, maxDim=1200, quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width:w, height:h} = img;
        if (w > maxDim || h > maxDim){
          const ratio = Math.min(maxDim/w, maxDim/h);
          w = Math.round(w*ratio); h = Math.round(h*ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function addImagesFromFiles(files, target='product'){
  const p = active();
  if (!p) return;
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    try {
      const dataUrl = await compressImage(f);
      const imgId = uid();
      await saveImage(imgId, dataUrl);
      if (target === 'sizing') {
        if (p.sizingChartId) await deleteImage(p.sizingChartId);
        p.sizingChartId = imgId;
      } else {
        p.imageIds.push(imgId);
      }
    } catch(e){ console.warn('image fail', e); }
  }
  await saveProduct(p);
  renderEditor();
  renderList();
}

function renderCalc(){
  const p = active(); if (!p) return;
  const cost = parseFloat(p.costPrice)||0;
  const ship = calcShipPerUnit(p);
  const mult = parseFloat(p.dutyMultiplier)||1.34;
  // Simple multiplier model: landed = (cost + shipping) × multiplier
  const landed = (cost + ship) * mult;
  const retail = parseFloat(p.retailPrice)||0;
  const margin = retail > 0 ? ((retail - landed) / retail * 100) : 0;
  const markup = landed > 0 ? (retail / landed) : 0;
  const suggested = landed / (1 - state.settings.targetMarginPct/100);

  // Shipping per unit display
  const shipArea = document.getElementById('shipCalcArea');
  const shipTotal = parseFloat(p.shippingTotal)||0;
  const shipItems = parseInt(p.shippingItems)||0;
  if (shipArea) {
    if (shipTotal > 0 && shipItems > 0) {
      shipArea.innerHTML = `<div class="calc-box" style="margin-top:10px">
        <span class="calc-label">Shipping / unit (${fmt(shipTotal)} ÷ ${shipItems} items)</span>
        <span class="calc-value" style="font-size:18px">${fmt(shipTotal/shipItems)}</span>
      </div>`;
    } else {
      shipArea.innerHTML = '';
    }
  }

  const calc = document.getElementById('calcArea');
  if (calc) calc.innerHTML = `
    <div class="calc-box" style="margin-top:10px;background:rgba(255,0,110,.08);border-color:var(--pink)">
      <span class="calc-label" style="color:var(--text)">Landed Cost / unit ((cost + shipping) × ${mult})</span>
      <span class="calc-value">${fmt(landed)}</span>
    </div>
    <div class="calc-box" style="margin-top:8px">
      <span class="calc-label">Suggested Retail (${state.settings.targetMarginPct}% margin)</span>
      <span class="calc-value" style="color:var(--text);font-size:18px">${fmt(suggested)}</span>
      <button class="btn btn-primary" onclick="useSuggested(${suggested.toFixed(2)})" style="padding:8px 20px;font-size:13px">✓ Use this price</button>
    </div>
  `;
  const m = document.getElementById('marginArea');
  if (m) m.innerHTML = retail > 0 ? `
    <div class="calc-grid">
      <div class="calc-box"><span class="calc-label">Margin %</span><span class="calc-value" style="color:${margin>=40?'var(--good)':margin>=20?'var(--warn)':'#f87171'}">${margin.toFixed(1)}%</span></div>
      <div class="calc-box"><span class="calc-label">Markup ×</span><span class="calc-value">${markup.toFixed(2)}×</span></div>
      <div class="calc-box"><span class="calc-label">Profit / unit</span><span class="calc-value">${fmt(retail-landed)}</span></div>
    </div>
  ` : '';
}

function useSuggested(v){
  const p = active();
  p.retailPrice = v;
  saveProduct(p);
  renderEditor();
}

function bulkAdd(){
  const n = parseInt(prompt('How many blank product rows to add?', '70'));
  if (!n || n<1) return;
  for (let i=0;i<n;i++){ state.products.push(newProduct()); }
  saveMeta();
  state.products.forEach(saveProduct);
  if (!state.activeId) state.activeId = state.products[0].id;
  renderAll();
}
async function duplicateProduct(){
  const p = active(); if (!p) return;
  // Deep-copy all images into new storage keys so duplicate is fully independent
  const copyImages = async (srcIds) => {
    const newIds = [];
    for (const oldId of (srcIds||[])) {
      const url = await loadImage(oldId);
      if (url) {
        const newId = uid();
        await saveImage(newId, url);
        newIds.push(newId);
      }
    }
    return newIds;
  };
  const [newSlot1, newSlot2, newSlot3, newGallery, newLegacyImgs] = await Promise.all([
    copyImages(p.slot1ImageIds),
    copyImages(p.slot2ImageIds),
    copyImages(p.slot3ImageIds),
    copyImages(p.galleryImageIds),
    copyImages(p.imageIds),
  ]);
  let newSizingChartId = null;
  if (p.sizingChartId) {
    const url = await loadImage(p.sizingChartId);
    if (url) { newSizingChartId = uid(); await saveImage(newSizingChartId, url); }
  }
  const copy = newProduct({
    ...p,
    id: uid(),
    code: p.code + '-COPY',
    slot1ImageIds: newSlot1,
    slot2ImageIds: newSlot2,
    slot3ImageIds: newSlot3,
    galleryImageIds: newGallery,
    imageIds: newLegacyImgs,
    sizingChartId: newSizingChartId,
    // Also deep-copy the stockBySize and specs objects (arrays/objects shared by reference otherwise)
    stockBySize: {...(p.stockBySize||{})},
    specs: {...(p.specs||{})},
    sizingChartData: (p.sizingChartData||[]).map(r => ({...r})),
    sizes: [...(p.sizes||[])],
    colours: [...(p.colours||[])],
  });
  state.products.splice(state.products.indexOf(p)+1, 0, copy);
  state.activeId = copy.id;
  await saveProduct(copy);
  await saveMeta();
  renderAll();
  showToast('✓ Duplicated with independent images');
}
function deleteProduct(){
  const p = active(); if (!p) return;
  if (!confirm(`Delete "${p.name||'this product'}"?`)) return;
  p.imageIds.forEach(deleteImage);
  if (p.sizingChartId) deleteImage(p.sizingChartId);
  STORE.delete('fk:p:'+p.id).catch(()=>{});
  deleteProductFromCloud(p.id);  // Also remove from cloud
  const idx = state.products.indexOf(p);
  state.products.splice(idx,1);
  state.activeId = state.products[Math.min(idx,state.products.length-1)]?.id || null;
  saveMeta(); renderAll();
}

// Clipboard paste
// Track which slot the user is interacting with (for paste targeting)
let activeSlotForPaste = null;

document.addEventListener('paste', e=>{
  const items = e.clipboardData?.items;
  if (!items) return;
  const files = [];
  for (const it of items){
    if (it.type.startsWith('image/')) files.push(it.getAsFile());
  }
  if (!files.length) return;
  // Route paste to the active slot, or gallery if none
  if (activeSlotForPaste && activeSlotForPaste >= 1 && activeSlotForPaste <= 3) {
    addSlotImages(activeSlotForPaste, files);
    activeSlotForPaste = null;
  } else if (activeSlotForPaste === 'gallery') {
    addGalleryImages(files);
    activeSlotForPaste = null;
  } else {
    // Default: try slot 1 if empty, else gallery
    const p = active();
    if (p && (!p.slot1ImageIds || !p.slot1ImageIds.length)) {
      addSlotImages(1, files);
    } else {
      addGalleryImages(files);
    }
  }
});

async function pasteToSlot(slotNum){
  activeSlotForPaste = slotNum;
  try {
    // Modern Clipboard API — read image directly
    const clipItems = await navigator.clipboard.read();
    for (const item of clipItems) {
      const imgType = item.types.find(t => t.startsWith('image/'));
      if (imgType) {
        const blob = await item.getType(imgType);
        const file = new File([blob], 'paste.jpg', { type: imgType });
        if (slotNum === 'gallery') {
          addGalleryImages([file]);
        } else {
          addSlotImages(slotNum, [file]);
        }
        activeSlotForPaste = null;
        return;
      }
    }
    showToast('No image found on clipboard. Copy a screenshot first.');
  } catch(e) {
    // Clipboard API denied or not available — fall back to keyboard paste prompt
    showToast('Press Cmd/Ctrl+V now to paste from clipboard');
    // activeSlotForPaste is already set, the paste event handler will catch it
  }
}

async function exportFKStockList(){
  if (!state.products.length){ alert('No products to export'); return; }
  showToast('Building FK Stock List... this may take a minute');

  const wb = new ExcelJS.Workbook();
  wb.creator = 'FashionKiller Intake';
  wb.created = new Date();
  const ws = wb.addWorksheet('Products');

  // Simplified columns as requested
  ws.columns = [
    { header: 'STOCK CODE / SKU', key: 'sku', width: 16 },
    { header: 'IMAGES', key: 'images', width: 50 },
    { header: 'PRODUCT NAME', key: 'name', width: 32 },
    { header: 'SHORT DESCRIPTION', key: 'shortDesc', width: 34 },
    { header: 'FULL DESCRIPTION', key: 'fullDesc', width: 50 },
    { header: 'CATEGORY', key: 'category', width: 22 },
    { header: 'SIZES', key: 'sizes', width: 22 },
    { header: 'COLOUR', key: 'colour', width: 18 },
    { header: 'QUANTITY', key: 'qty', width: 12 },
    { header: 'RETAIL PRICE', key: 'price', width: 16 },
    { header: 'PRODUCT DETAILS', key: 'specs', width: 40 },
  ];

  // Style header row
  const headerRow = ws.getRow(1);
  headerRow.font = { bold: true, size: 11, color: { argb: 'FFFFFFFF' } };
  headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1a1a1a' } };
  headerRow.height = 28;
  headerRow.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };

  // Add product rows
  for (let i = 0; i < state.products.length; i++) {
    const p = state.products[i];
    const rowNum = i + 2;

    // Build sizes string: "1 x S, 2 x M"
    const sizesStr = Object.entries(p.stockBySize||{})
      .filter(([,q]) => parseInt(q) > 0)
      .map(([s,q]) => `${q} x ${s}`)
      .join(', ') || p.sizes.join(', ');

    // Total quantity
    const totalQty = calcTotalStock(p);

    // Build specs string: "Material: Cotton\nFit: Slim\nStyle: Casual"
    const specLabels = {material:'Material', fit:'Fit', style:'Style', season:'Season', sleeve_length:'Sleeve', collar:'Collar', pattern_type:'Pattern', length_category:'Length', feature:'Feature'};
    const specsStr = Object.entries(p.specs||{})
      .filter(([,v]) => v)
      .map(([k,v]) => `${specLabels[k]||k}: ${v}`)
      .join('\n');
    // Add care instructions if present
    const fullSpecs = [specsStr, p.careInstructions ? `Care: ${p.careInstructions}` : ''].filter(Boolean).join('\n');

    const row = ws.addRow({
      sku: p.code,
      images: '',
      name: p.name,
      shortDesc: p.shortDescription || '',
      fullDesc: p.description || '',
      category: p.category || '',
      sizes: sizesStr,
      colour: p.colours.join(', '),
      qty: totalQty || '',
      price: parseFloat(p.retailPrice) || null,
      specs: fullSpecs,
    });

    // Currency format for price
    row.getCell('price').numFmt = '#,##0.00';

    // Set row height to fit images nicely
    row.height = 110;
    row.alignment = { vertical: 'top', wrapText: true };

    // Embed ALL product images in the Images column (B, index 1)
    // Stack in a grid: up to 3 per row, wrap to second row if more
    const allImgIds = [...new Set([
      ...(p.slot1ImageIds||[]), ...(p.slot2ImageIds||[]),
      ...(p.galleryImageIds||[]), ...(p.imageIds||[])
    ])];
    const imgSize = 65;
    const imgsPerRow = 3;
    let imgIdx = 0;
    for (const imgId of allImgIds) {
      try {
        const dataUrl = await loadImage(imgId);
        if (dataUrl) {
          const b64 = dataUrl.split(',')[1];
          const excelImgId = wb.addImage({ base64: b64, extension: 'jpeg' });
          const colInRow = imgIdx % imgsPerRow;
          const rowInGrid = Math.floor(imgIdx / imgsPerRow);
          ws.addImage(excelImgId, {
            tl: { col: 1.02 + (colInRow * 0.32), row: rowNum - 1 + 0.05 + (rowInGrid * 0.48) },
            ext: { width: imgSize, height: imgSize }
          });
          imgIdx++;
        }
      } catch (e) { console.warn('Image embed failed:', p.code, imgId, e); }
    }
    // Increase row height if images wrap to multiple rows
    const imgRows = Math.ceil(allImgIds.length / imgsPerRow);
    if (imgRows > 1) row.height = Math.max(row.height, imgRows * 75);
  }

  // Freeze header row
  ws.views = [{ state: 'frozen', ySplit: 1 }];

  // ============ SECOND WORKSHEET: Structured sizing chart data ============
  const wsSizing = wb.addWorksheet('Sizing Charts');
  const allMeasureKeys = new Set();
  for (const p of state.products) {
    for (const row of (p.sizingChartData||[])) {
      Object.keys(row).forEach(k => {
        if (k !== 'size' && k !== 'units') allMeasureKeys.add(k);
      });
    }
  }
  const orderedKeys = ['bust','chest','waist','hip','hips','length','sleeve','sleeve_length','shoulder','inseam','thigh','rise'];
  const measureCols = [
    ...orderedKeys.filter(k => allMeasureKeys.has(k)),
    ...[...allMeasureKeys].filter(k => !orderedKeys.includes(k)).sort()
  ];

  wsSizing.columns = [
    { header: 'SKU', key: 'sku', width: 16 },
    { header: 'PRODUCT NAME', key: 'name', width: 32 },
    { header: 'SIZE', key: 'size', width: 10 },
    { header: 'UNITS', key: 'units', width: 10 },
    ...measureCols.map(k => ({ header: k.toUpperCase().replace(/_/g,' '), key: k, width: 12 }))
  ];
  const sizingHeader = wsSizing.getRow(1);
  sizingHeader.font = { bold: true, size: 11 };
  sizingHeader.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE4E4E4' } };
  sizingHeader.height = 22;
  sizingHeader.alignment = { vertical: 'middle', horizontal: 'center' };

  for (const p of state.products) {
    if (!(p.sizingChartData||[]).length) continue;
    for (const row of p.sizingChartData) {
      const rowData = {
        sku: p.code,
        name: p.name,
        size: row.size,
        units: row.units || 'cm',
      };
      for (const k of measureCols) {
        if (row[k] != null && row[k] !== '') rowData[k] = row[k];
      }
      wsSizing.addRow(rowData);
    }
  }
  wsSizing.views = [{ state: 'frozen', ySplit: 1 }];

  // Save
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  saveAs(blob, `FashionKiller_Stock_List_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('✓ FK Stock List ready!');
}


async function exportData(){
  if (!state.products.length){ alert('No products to export'); return; }
  showToast('Building export... this may take a minute for large catalogues');
  const zip = new JSZip();
  const imgFolder = zip.folder('images');
  const sizingFolder = zip.folder('sizing-charts');

  const rows = [];
  for (const p of state.products){
    const cost = parseFloat(p.costPrice)||0;
    const ship = calcShipPerUnit(p);
    const mult = parseFloat(p.dutyMultiplier)||1.34;
    const landed = (cost + ship) * mult;
    const retail = parseFloat(p.retailPrice)||0;
    const codeSlug = (p.code||p.id).replace(/[^a-z0-9_-]/gi,'_');
    const imgFiles = [];
    // Collect all images: slot1, gallery, legacy
    const allImgIds = [...(p.slot1ImageIds||[]), ...(p.galleryImageIds||[]), ...(p.imageIds||[])];
    const uniqueIds = [...new Set(allImgIds)];
    for (let i=0;i<uniqueIds.length;i++){
      const url = await loadImage(uniqueIds[i]);
      if (url){
        const blob = dataUrlToBlob(url);
        const fname = `${codeSlug}_${i+1}.jpg`;
        imgFolder.file(fname, blob);
        imgFiles.push(fname);
      }
    }
    let sizingFile = '';
    if (p.sizingChartId){
      const url = await loadImage(p.sizingChartId);
      if (url){
        sizingFile = `${codeSlug}_sizing.jpg`;
        sizingFolder.file(sizingFile, dataUrlToBlob(url));
      }
    }
    rows.push({
      'Name': p.name,
      'Code': p.code,
      'SEO Keywords': p.keywords,
      'Short Description': p.shortDescription,
      'Description': p.description,
      'Category': p.category,
      'Tags': p.tags,
      'Sizes': p.sizes.join(', '),
      'Stock by Size': Object.entries(p.stockBySize||{}).map(([s,q])=>`${s}:${q}`).join(', '),
      'Total Stock': Object.values(p.stockBySize||{}).reduce((a,b)=>a+(parseInt(b)||0),0),
      'Colours': p.colours.join(', '),
      'Material': p.specs?.material || '',
      'Fit': p.specs?.fit || '',
      'Style': p.specs?.style || '',
      'Season': p.specs?.season || '',
      'Sleeve Length': p.specs?.sleeve_length || '',
      'Collar': p.specs?.collar || '',
      'Pattern': p.specs?.pattern_type || '',
      'Length Category': p.specs?.length_category || '',
      'Feature': p.specs?.feature || '',
      'Care Instructions': p.careInstructions || '',
      'Model Info': p.modelInfo || '',
      'Sizing Chart Data': (p.sizingChartData||[]).map(r => {
        const measures = Object.entries(r).filter(([k])=>k!=='size'&&k!=='units').map(([k,v])=>`${k}:${v}`).join(' ');
        return `${r.size} (${measures})`;
      }).join(' | '),
      'Image Files': imgFiles.join(' | '),
      'Sizing Chart File': sizingFile,
      'Wholesale Price': cost,
      'Shipping/unit': ship,
      'Import Duty Multiplier': parseFloat(p.dutyMultiplier)||1.34,
      'Landed Cost': +((cost + ship) * (parseFloat(p.dutyMultiplier)||1.34)).toFixed(2),
      'Retail Price': retail,
      'Sale Price': p.salePrice,
      'Margin %': retail>0 ? +((retail-(cost + ship) * (parseFloat(p.dutyMultiplier)||1.34))/retail*100).toFixed(1) : '',
      'Profit/unit': retail>0 ? +(retail-(cost + ship) * (parseFloat(p.dutyMultiplier)||1.34)).toFixed(2) : '',
      'Currency': p.currency || state.settings.currency,
      'Supplier': p.supplierName,
      'Supplier URL': p.supplierUrl
    });
  }

  const ws = XLSX.utils.json_to_sheet(rows);
  // Column widths
  ws['!cols'] = [
    {wch:25},{wch:14},{wch:30},{wch:40},{wch:18},{wch:24},{wch:10},{wch:18},
    {wch:30},{wch:22},{wch:12},{wch:12},{wch:8},{wch:8},{wch:14},{wch:14},{wch:10},{wch:14},{wch:10}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Products');
  const xlsxBuf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  zip.file('FashionKiller_Products.xlsx', xlsxBuf);

  const blob = await zip.generateAsync({type:'blob'});
  saveAs(blob, `FashionKiller_Intake_${new Date().toISOString().slice(0,10)}.zip`);
  showToast('✓ Export ready!');
}
function dataUrlToBlob(url){
  const [meta, b64] = url.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

async function renderTable(){
  const tv = document.getElementById('tableView');
  const sorted = [...state.products].sort((a,b)=>{
    const k = state.tableSort.col;
    let av = a[k], bv = b[k];
    if (k === 'totalStock') { av = calcTotalStock(a); bv = calcTotalStock(b); }
    if (k === 'landedCost') { av = calcLanded(a); bv = calcLanded(b); }
    if (k === 'profit') { av = calcProfit(a); bv = calcProfit(b); }
    if (Array.isArray(av)) av = av.join(',');
    if (Array.isArray(bv)) bv = bv.join(',');
    av = String(av||''); bv = String(bv||'');
    const cmp = av.localeCompare(bv, undefined, {numeric:true});
    return state.tableSort.dir === 'asc' ? cmp : -cmp;

    return `<th class="${active}" ${click} style="min-width:${c.w}">${c.label}${arrow}</th>`;

  const tbHtml = sorted.map((p, i) => {

function calcTotalStock(p){ return Object.values(p.stockBySize||{}).reduce((a,b)=>a+(parseInt(b)||0),0); }
function calcShipPerUnit(p){
  // New fields: shippingTotal / shippingItems
  const total = parseFloat(p.shippingTotal)||0;
  const items = parseInt(p.shippingItems)||0;
  if (total > 0 && items > 0) return total / items;
  // Backward compat: old shippingPerUnit field
  return parseFloat(p.shippingPerUnit)||0;
}
function calcLanded(p){ return ((parseFloat(p.costPrice)||0)+calcShipPerUnit(p))*(parseFloat(p.dutyMultiplier)||1.34); }
function calcProfit(p){ return (parseFloat(p.retailPrice)||0) - calcLanded(p); }

function renderScorecard(){
  const el = document.getElementById('scorecard');
  if (!el) return;
  if (!state.products.length){
    el.innerHTML = '';
    return;
  }
  const totalProducts = state.products.length;
  const completeProducts = state.products.filter(p => statusOf(p) === 'complete').length;
  const totalStockAll = state.products.reduce((a,p) => a + calcTotalStock(p), 0);
  const totalWholesale = state.products.reduce((a,p) => a + (parseFloat(p.costPrice)||0), 0);
  const totalRetail = state.products.reduce((a,p) => a + (parseFloat(p.retailPrice)||0), 0);
  const totalLanded = state.products.reduce((a,p) => a + calcLanded(p), 0);
  const totalProfit = totalRetail - totalLanded;
  const avgMargin = totalRetail > 0 ? ((totalProfit / totalRetail) * 100) : 0;
  const avgMarkup = totalLanded > 0 ? (totalRetail / totalLanded) : 0;
  const totalRetailValue = state.products.reduce((a,p) => {
    const stock = calcTotalStock(p);
    return a + stock * (parseFloat(p.retailPrice)||0);
  }, 0);
  const totalCostValue = state.products.reduce((a,p) => {
    const stock = calcTotalStock(p);
    return a + stock * calcLanded(p);
  }, 0);
  const totalProfitValue = totalRetailValue - totalCostValue;

  el.innerHTML = `<div class="scorecard">
    <div class="score-tile">
      <div class="score-label">Products</div>
      <div class="score-val">${totalProducts}</div>
      <div class="score-sub">${completeProducts} reviewed</div>
    </div>
    <div class="score-tile">
      <div class="score-label">Total Units</div>
      <div class="score-val">${totalStockAll}</div>
      <div class="score-sub">across all sizes</div>
    </div>
    <div class="score-tile">
      <div class="score-label">Total Wholesale</div>
      <div class="score-val">${fmt(totalWholesale)}</div>
      <div class="score-sub">before duty</div>
    </div>
    <div class="score-tile">
      <div class="score-label">Total Landed Cost</div>
      <div class="score-val">${fmt(totalLanded)}</div>
      <div class="score-sub">wholesale × duty</div>
    </div>
    <div class="score-tile">
      <div class="score-label">Total Retail</div>
      <div class="score-val">${fmt(totalRetail)}</div>
      <div class="score-sub">all products × 1 unit</div>
    </div>
    <div class="score-tile highlight">
      <div class="score-label">Total Profit (per unit)</div>
      <div class="score-val" style="color:${totalProfit>=0?'var(--good)':'#f87171'}">${fmt(totalProfit)}</div>
      <div class="score-sub">${avgMargin.toFixed(1)}% avg margin · ${avgMarkup.toFixed(2)}× markup</div>
    </div>
    <div class="score-tile highlight">
      <div class="score-label">Stock Retail Value</div>
      <div class="score-val">${fmt(totalRetailValue)}</div>
      <div class="score-sub">if all ${totalStockAll} units sell</div>
    </div>
    <div class="score-tile highlight">
      <div class="score-label">Stock Profit Value</div>
      <div class="score-val" style="color:${totalProfitValue>=0?'var(--good)':'#f87171'}">${fmt(totalProfitValue)}</div>
      <div class="score-sub">total revenue − total cost</div>
    </div>
  </div>`;
}
function sortTable(col){
  if (state.tableSort.col === col) state.tableSort.dir = state.tableSort.dir==='asc' ? 'desc' : 'asc';
  else { state.tableSort.col = col; state.tableSort.dir = 'asc'; }
  renderTable();
}
function updField(id, field, val){
  const p = state.products.find(x=>x.id===id);
  if (!p) return;
  p[field] = val;
  saveProduct(p);
  renderProgress();
}

async function handleSiImage(file){

async function runSmartImport(){
  const btn = document.getElementById('siExtractBtn');
  const isImage = document.getElementById('siImage').classList.contains('active');
  let messages;
  const schema = `Return ONLY valid JSON, no markdown, no preamble. Schema:
{
  "name": "product name (string)",
  "shortDescription": "one catchy line for product card (string, ~10 words)",
  "description": "full product description (2-4 sentences, retail tone)",
  "category": "best-fit category like 'Dresses' or 'Tops > Blouses' (string)",
  "tags": "comma-separated relevant tags (string)",
  "keywords": "comma-separated SEO keywords for South African market (string)",
  "sizes": ["XS","S","M","L"],
  "colours": ["Black","Red"],
  "price": number or null,
  "currency": "ZAR" or "USD" or "EUR" or "CNY" etc,
  "image_urls": ["https://full-image-urls"],
  "supplier_url": "URL if visible in content"
}
If a field cannot be determined, use null or empty array. Be especially careful to extract ALL image URLs found.`;

  if (isImage) {
    if (!smartImportImage){ alert('Please paste or upload a screenshot first'); return; }
    const b64 = smartImportImage.split(',')[1];
    messages = [{
      role:'user',
      content:[
        {type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}},
        {type:'text', text:`Extract product data from this fashion e-commerce screenshot.\n\n${schema}`}
      ]
    }];
  } else {
    const text = document.getElementById('siPaste').value.trim();
    if (!text){ alert('Please paste page text first'); return; }
    messages = [{role:'user', content:`Extract product data from this fashion e-commerce page content.\n\n${schema}\n\nPage content:\n${text.slice(0,15000)}`}];
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Extracting...';
  try {
    if (!state.settings.apiKey){
      throw new Error('No API key set. Open ⚙ Settings and paste your Anthropic API key (get one at console.anthropic.com).');
    }
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': state.settings.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({model:'claude-sonnet-4-5', max_tokens:1500, messages})
    });
    if (!r.ok){
      const errText = await r.text();
      throw new Error(`API ${r.status}: ${errText.slice(0,200)}`);
    }
    const data = await r.json();
    const text = data.content.filter(c=>c.type==='text').map(c=>c.text).join('').replace(/```json|```/g,'').trim();
    const extracted = JSON.parse(text);
    showSiResult(extracted);
  } catch(e){
    document.getElementById('siResult').innerHTML = `<div style="color:#f87171;padding:10px">Extraction failed: ${escapeHtml(e.message)}. Try again or fall back to manual entry.</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Extract with AI';
  }
}

          <div class="extracted-img-row">
            ${ex.image_urls.map(u=>`<a href="${escapeAttr(u)}" target="_blank" style="background-image:url(${escapeAttr(u)})" title="${escapeAttr(u)}"></a>`).join('')}

      <div class="modal-actions" style="margin-top:14px">
        <button class="btn btn-primary" onclick="applySmartImport(${JSON.stringify(ex).replace(/"/g,'&quot;')}, '${escapeAttr(supplierUrl)}')">Apply Selected to Product</button>
      </div>
    </div>
  `;
  document.getElementById('siResult').innerHTML = html;
}

async function applySmartImport(ex, supplierUrl){
  const p = active();
  const map = {
    name:'name', shortDescription:'shortDescription', description:'description',
    category:'category', tags:'tags', keywords:'keywords'
  };
  for (const [src, dst] of Object.entries(map)){
    const cb = document.getElementById('si-'+src);
    if (cb && cb.checked && ex[src]) p[dst] = ex[src];
  }
  if (document.getElementById('si-sizes')?.checked && Array.isArray(ex.sizes)) p.sizes = ex.sizes;
  if (document.getElementById('si-colours')?.checked && Array.isArray(ex.colours)) p.colours = ex.colours;
  if (document.getElementById('si-costPrice')?.checked && ex.price){
    // If currency is foreign, store as cost; user will adjust
    p.costPrice = ex.price;
  }
  if (supplierUrl) p.supplierUrl = supplierUrl;
  if (document.getElementById('si-screenshot')?.checked && smartImportImage){
    const imgId = uid();
    await saveImage(imgId, smartImportImage);
    p.imageIds.push(imgId);
  }
  await saveProduct(p);
  document.querySelector('.modal-bg')?.remove();
  renderEditor();
  renderList();
  showToast('✓ Imported! Review and adjust as needed.');
}

async function exportWooCommerce(){
  if (!state.products.length){ alert('No products to export'); return; }
  showToast('Building WooCommerce CSV...');
  const zip = new JSZip();
  const imgFolder = zip.folder('images');
  const sizingFolder = zip.folder('sizing-charts');
  const rows = [];
  for (const p of state.products){
    const cost = parseFloat(p.costPrice)||0;
    const ship = calcShipPerUnit(p);
    const mult = parseFloat(p.dutyMultiplier)||1.34;
    const landed = (cost + ship) * mult;
    const codeSlug = (p.code||p.id).replace(/[^a-z0-9_-]/gi,'_');
    const imgFiles = [];
    const allImgIds = [...new Set([...(p.slot1ImageIds||[]), ...(p.galleryImageIds||[]), ...(p.imageIds||[])])];
    for (let i=0;i<allImgIds.length;i++){
      const url = await loadImage(allImgIds[i]);
      if (url){
        const fname = `${codeSlug}_${i+1}.jpg`;
        imgFolder.file(fname, dataUrlToBlob(url));
        imgFiles.push(fname);
      }
    }
    // Sizing chart — check slot2 first, then legacy
    const sizingId = (p.slot2ImageIds && p.slot2ImageIds[0]) || p.sizingChartId;
    if (sizingId){
      const url = await loadImage(sizingId);

    // WooCommerce CSV columns
    rows.push({
      'Type': p.sizes.length>1 || p.colours.length>1 ? 'variable' : 'simple',
      'SKU': p.code,
      'Name': p.name,
      'Published': 1,
      'Featured': 0,
      'Visibility in catalog': 'visible',
      'Short description': p.shortDescription,
      'Description': p.description,
      'Tax status': 'taxable',
      'In stock?': totalStock > 0 ? 1 : 0,
      'Stock': totalStock,
      'Backorders allowed?': 0,
      'Weight (g)': p.weightGrams,
      'Allow customer reviews?': 1,
      'Sale price': p.salePrice,
      'Regular price': p.retailPrice,
      'Categories': p.category,
      'Tags': p.tags,
      'Images': imgFiles.join(', '),
      'Attribute 1 name': 'Size',
      'Attribute 1 value(s)': p.sizes.join(' | '),
      'Attribute 1 visible': 1,
      'Attribute 1 global': 1,
      'Attribute 2 name': 'Colour',
      'Attribute 2 value(s)': p.colours.join(' | '),
      'Attribute 2 visible': 1,
      'Attribute 2 global': 1,
      'Meta: _cost_price': cost,
      'Meta: _landed_cost': +landed.toFixed(2),
      'Meta: _duty_multiplier': mult,
      'Meta: _stock_by_size': stockBreakdown,
      'Meta: _supplier_url': p.supplierUrl,
      'Meta: _supplier_name': p.supplierName,
      'Meta: _seo_keywords': p.keywords,
      'Meta: _material': p.specs?.material || '',
      'Meta: _fit': p.specs?.fit || '',
      'Meta: _style': p.specs?.style || '',
      'Meta: _season': p.specs?.season || '',
      'Meta: _sleeve_length': p.specs?.sleeve_length || '',
      'Meta: _collar': p.specs?.collar || '',
      'Meta: _pattern': p.specs?.pattern_type || '',
      'Meta: _length_category': p.specs?.length_category || '',
      'Meta: _feature': p.specs?.feature || '',
      'Meta: _care_instructions': p.careInstructions || '',
      'Meta: _model_info': p.modelInfo || '',
    });
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  const csv = XLSX.utils.sheet_to_csv(ws);
  zip.file('FashionKiller_WooCommerce.csv', csv);
  zip.file('README.txt', `FashionKiller WooCommerce Import\n================================\n\n1. In WordPress admin: Products > Import\n2. Upload FashionKiller_WooCommerce.csv\n3. Map columns (defaults should work)\n4. Upload images from /images folder to Media Library first, OR use a plugin like WP All Import to auto-match by filename.\n\nImage filenames in the CSV match the files in /images/.\nSizing charts are in /sizing-charts/ — link these manually in product descriptions.\n`);
  const blob = await zip.generateAsync({type:'blob'});
  saveAs(blob, `FashionKiller_WooCommerce_${new Date().toISOString().slice(0,10)}.zip`);
  showToast('✓ WooCommerce CSV ready!');
}

async function exportBackup(){
  showToast('Building full backup...');
  const zip = new JSZip();
  // All product data
  const backup = {
    version: 1,
    exportedAt: new Date().toISOString(),
    settings: state.settings,
    products: state.products
  };
  zip.file('data.json', JSON.stringify(backup, null, 2));
  // All images
  const imgFolder = zip.folder('images');
  for (const p of state.products){
    for (const id of p.imageIds){
      const url = await loadImage(id);
      if (url) imgFolder.file(id+'.jpg', dataUrlToBlob(url));
    }
    if (p.sizingChartId){
      const url = await loadImage(p.sizingChartId);
      if (url) imgFolder.file(p.sizingChartId+'.jpg', dataUrlToBlob(url));
    }
  }
  const blob = await zip.generateAsync({type:'blob'});
  saveAs(blob, `FashionKiller_Backup_${new Date().toISOString().slice(0,10)}.zip`);
  state.lastBackupTime = Date.now();
  state.savesSinceBackup = 0;
  showToast('✓ Backup saved! Keep this file safe.');
}

async function restoreBackup(file){
  if (!confirm('Restore will REPLACE all current data. Continue?')) return;
  try {
    const zip = await JSZip.loadAsync(file);
    const dataFile = zip.file('data.json');
    if (!dataFile) throw new Error('Invalid backup: no data.json');
    const backup = JSON.parse(await dataFile.async('string'));
    // Wipe current
    for (const p of state.products){
      p.imageIds.forEach(deleteImage);
      if (p.sizingChartId) deleteImage(p.sizingChartId);
      await STORE.delete('fk:p:'+p.id).catch(()=>{});
    }
    state.products = backup.products || [];
    state.settings = {...state.settings, ...(backup.settings||{})};
    // Restore images
    const imgFolder = zip.folder('images');
    if (imgFolder){
      const files = Object.keys(imgFolder.files).filter(f=>!imgFolder.files[f].dir);
      for (const fname of files){
        const id = fname.replace(/^images\//,'').replace(/\.jpg$/,'');
        const blob = await zip.file(fname).async('blob');
        const dataUrl = await blobToDataUrl(blob);
        await saveImage(id, dataUrl);
      }
    }
    for (const p of state.products) await saveProduct(p);
    await saveMeta();
    state.activeId = state.products[0]?.id || null;
    renderAll();
    showToast('✓ Backup restored!');
  } catch(e){
    alert('Restore failed: '+e.message);
  }
}
function blobToDataUrl(blob){
  return new Promise((resolve)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.readAsDataURL(blob);
  });
}

  const imgIds = p['slot'+n+'ImageIds'] || [];

  const hasImages = imgIds.length > 0;
  const klass = hasImages ? (status==='extracted'?'extracted':status==='extracting'?'extracting':status==='failed'?'failed':'has-images') : '';
  const statusLabel = status==='extracted' ? 'EXTRACTED' : status==='extracting' ? 'WORKING...' : status==='failed' ? 'FAILED' : hasImages ? 'READY' : 'EMPTY';
  return `
    <div class="slot ${klass}">

async function callClaude(messages, maxTokens=1500){
  if (!state.settings.apiKey){
    throw new Error('No API key. Open ⚙ Settings and paste your Anthropic API key.');
  }
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': state.settings.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({model:'claude-sonnet-4-5', max_tokens:maxTokens, messages})
  });
  if (!r.ok) throw new Error(`API ${r.status}: ${(await r.text()).slice(0,200)}`);
  const data = await r.json();
  const text = data.content.filter(c=>c.type==='text').map(c=>c.text).join('').replace(/```json|```/g,'').trim();
  return JSON.parse(text);
}

async function imagesToContent(imgIds){
  const content = [];
  for (const id of imgIds){
    const url = await loadImage(id);
    if (!url) continue;
    const b64 = url.split(',')[1];
    content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}});
  }
  return content;
}

async function extractSlot(n){
  const p = active(); if (!p) return;
  const imgIds = p['slot'+n+'ImageIds'] || [];
  if (!imgIds.length) return;
  p['slot'+n+'Status'] = 'extracting';
  await saveProduct(p);
  renderEditor();
  try {
    const imgContent = await imagesToContent(imgIds);
    const messages = [{
      role: 'user',
      content: [...imgContent, {type:'text', text: SLOT_PROMPTS[n]}]
    }];
    const result = await callClaude(messages);
    await applySlotResult(n, result);
    p['slot'+n+'Status'] = 'extracted';
    await saveProduct(p);
    renderEditor();
    renderList();
    showToast(`✓ Slot ${n} extracted`);
  } catch(e){
    console.error('Extract slot '+n+' failed:', e);
    p['slot'+n+'Status'] = 'failed';
    await saveProduct(p);
    renderEditor();
    showToast(`✗ Slot ${n} failed: ${e.message.slice(0,80)}`);
  }
}

async function applySlotResult(n, result){
  const p = active();
  if (n === 1){
    if (result.name) p.name = result.name;
    if (result.shortDescription) p.shortDescription = result.shortDescription;
    // Explicitly keep full description empty — Dommie writes her own content here
    p.description = '';
    if (result.keywords) p.keywords = result.keywords;
    if (result.tags) p.tags = result.tags;
    if (result.category) p.category = result.category;
    if (result.price != null) p.costPrice = result.price;  // cost price, will be adjusted
    if (result.currency) p.currency = result.currency;
    // Do NOT auto-select sizes from Slot 1 — Dommie manually picks ordered sizes
    if (Array.isArray(result.colours) && result.colours.length) p.colours = result.colours;
    if (result.supplier_url) p.supplierUrl = result.supplier_url;
    // Also copy first slot1 image to main imageIds if empty
    if (p.imageIds.length === 0 && p.slot1ImageIds.length){
      p.imageIds.push(p.slot1ImageIds[0]);
    }
  } else if (n === 2){
    if (Array.isArray(result.rows)){
      p.sizingChartData = result.rows.map(r => ({size:r.size, units:result.units||'cm', ...r.measurements}));
    }
    // Do NOT auto-select sizes — Dommie manually picks which ones she ordered
    // Copy first sizing image to legacy sizingChartId
    if (!p.sizingChartId && p.slot2ImageIds.length) p.sizingChartId = p.slot2ImageIds[0];
  } else if (n === 3){
    if (!p.specs) p.specs = {};
    const keys = ['material','fit','style','season','sleeve_length','collar','pattern_type','length_category','feature'];
    for (const k of keys){
      if (result[k]) p.specs[k] = result[k];
    }
    if (result.care_instructions) p.careInstructions = result.care_instructions;
    if (result.model_info) p.modelInfo = result.model_info;
  }
}

async function runPipeline(){
  const p = active(); if (!p) return;
  const slots = [1,2,3].filter(n => (p['slot'+n+'ImageIds']||[]).length);
  if (!slots.length) return;
  showToast(`Extracting ${slots.length} slot${slots.length>1?'s':''} in parallel...`);
  await Promise.all(slots.map(n => extractSlot(n)));
  // Auto-open manual override so user can review
  p.manualOverrideOpen = true;
  await saveProduct(p);
  renderEditor();
}

function renderExtractedPreview(p){
  const hasData = p.name || Object.keys(p.specs||{}).length || (p.sizingChartData||[]).length;
  if (!hasData) return '';
  let html = '<div class="gallery-section"><div class="section-title" style="margin-bottom:10px">📊 Extracted Data <span style="font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">— review and edit as needed</span></div>';
  if (p.name || p.shortDescription){
    html += `<div style="margin-bottom:14px">`;
    if (p.name) html += `<div style="font-family:'Bebas Neue';font-size:20px;letter-spacing:1px;color:var(--text);margin-bottom:4px">${escapeHtml(p.name)}</div>`;
    if (p.shortDescription) html += `<div style="font-style:italic;color:var(--muted);font-size:12px;margin-bottom:6px">${escapeHtml(p.shortDescription)}</div>`;
    html += `</div>`;
  }
  if (Object.keys(p.specs||{}).length){
    html += '<div style="margin-bottom:12px"><div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin-bottom:6px">Product Details</div><div class="specs-display">';
    const specLabels = {material:'Material', fit:'Fit', style:'Style', season:'Season', sleeve_length:'Sleeve', collar:'Collar', pattern_type:'Pattern', length_category:'Length', feature:'Feature'};
    for (const [k, v] of Object.entries(p.specs)){
      if (!v) continue;
      html += `<div class="spec-pill"><b>${specLabels[k]||k}</b><span>${escapeHtml(v)}</span></div>`;
    }
    html += '</div></div>';
  }
  if (p.careInstructions || p.modelInfo){
    html += '<div style="display:flex;gap:12px;margin-bottom:12px;font-size:11px">';
    if (p.careInstructions) html += `<div><b style="color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-size:9px">Care:</b> ${escapeHtml(p.careInstructions)}</div>`;
    if (p.modelInfo) html += `<div><b style="color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-size:9px">Model:</b> ${escapeHtml(p.modelInfo)}</div>`;
    html += '</div>';
  }
  if ((p.sizingChartData||[]).length){
    const allKeys = new Set();
    p.sizingChartData.forEach(r => Object.keys(r).forEach(k => { if (k !== 'size' && k !== 'units') allKeys.add(k); }));
    const keys = [...allKeys];
    html += `<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin-bottom:4px">Sizing (${p.sizingChartData[0].units||'cm'})</div>`;
    html += '<table class="sizing-table"><thead><tr><th>Size</th>' + keys.map(k=>`<th>${k}</th>`).join('') + '</tr></thead><tbody>';
    p.sizingChartData.forEach((r, i) => {
      html += `<tr><td><b>${escapeHtml(r.size)}</b></td>` + keys.map(k=>`<td><input value="${r[k]||''}" onchange="updSizing(${i},'${k}',this.value)"></td>`).join('') + '</tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  return html;
}

function updSizing(rowIdx, key, val){
  const p = active();
  if (!p.sizingChartData[rowIdx]) return;
  p.sizingChartData[rowIdx][key] = isNaN(parseFloat(val)) ? val : parseFloat(val);
  saveProduct(p);
}

const DOMMIE_MESSAGES = [
  "You're building something real, Dommie. Every product you add is a step closer to the empire. 🖤",
  "FashionKiller didn't build itself — YOU did. Keep going, queen. 💅",
  "70 products is a lot. But you've handled worse. Let's smash this. 🔥",
  "Remember: every big brand started with one shipment and one stubborn woman who refused to quit. That's you. 👑",
  "Today's hustle is tomorrow's 'remember when we started?' story. Let's make it count. ⚡",
  "The fashion game needs more women like you. Go show them how it's done. 🦋",
  "One product at a time. One customer at a time. One day you'll look back and be amazed how far you came. 🌟",
  "Dommie, the world doesn't need another fast-fashion copy. It needs YOUR eye, YOUR taste, YOUR brand. That's FashionKiller. 💎",
  "Tokio believes in you. And so do we. Now let's get to work. 🐶",
  "Not every day will be easy. But every day you show up is a day you win. You showed up today. 💪",
];

function showMotivationalQuote(){
  const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  const d = DOMMIE_MESSAGES[Math.floor(Math.random() * DOMMIE_MESSAGES.length)];
  const m = document.createElement('div');
  m.className = 'motive-modal';
  m.innerHTML = `<div class="motive-box">
    <div class="motive-emoji">${q.emoji}</div>
    <div class="motive-quote">"${q.text}"</div>
    ${q.author ? `<div class="motive-author">— ${q.author}</div>` : '<div style="height:12px"></div>'}
    <div class="motive-dommie">${d}</div>
    <button class="motive-close" onclick="this.closest('.motive-modal').remove()">Let's Go 🔥</button>
  </div>`;
  document.body.appendChild(m);
  // Close on background click
  m.addEventListener('click', e => { if (e.target === m) m.remove(); });
}

// ============ INIT ============
// Boot the app. Supabase is optional — app MUST work without it.
function bootApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  loadAll();
  setTimeout(showMotivationalQuote, 500);
}

function trySupabaseBoot(){
  try {
    const ok = initSupabase();
    if (!ok) {
      console.warn('[Boot] Supabase not available, running offline');
      updateSyncBadge('offline');
      bootApp();
      return;
    }
    sb.auth.getSession().then(({data:{session}}) => {
      if (session && session.user) {
        sbUser = session.user;
        updateSyncBadge('synced');
        bootApp();
      }
    }).catch(e => {
      console.warn('[Boot] Session check failed:', e);
    });
  } catch(e) {
    console.warn('[Boot] Supabase init crashed:', e);
    updateSyncBadge('offline');
    bootApp();
  }
}

let booted = false;
function attemptBoot(){
  if (booted) return;
  booted = true;
  trySupabaseBoot();
}

if (typeof supabase !== 'undefined') {
  attemptBoot();
} else {
  let checks = 0;
  const poller = setInterval(() => {
    checks++;
    if (typeof supabase !== 'undefined') {
      clearInterval(poller);
      attemptBoot();
    } else if (checks >= 30) {
      clearInterval(poller);
      console.warn('[Boot] Supabase CDN timeout, booting offline');
      attemptBoot();
    }
  }, 100);
}
</script>
